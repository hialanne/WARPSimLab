
name: Build macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "WARPSimLab version without leading v"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: arm64
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyobjc-framework-Cocoa

      - name: Run tests
        run: python -m pytest

      - name: Build application
        run: |
          python -m PyInstaller --clean --noconfirm WARPSimLab-macOS.spec
          test -d dist/WARPSimLab.app
          test -x dist/WARPSimLab.app/Contents/MacOS/WARPSimLab
          test "$(lipo -archs dist/WARPSimLab.app/Contents/MacOS/WARPSimLab)" = "arm64"

      - name: Create DMG and checksum
        env:
          VERSION: ${{ inputs.version }}
        run: |
          rm -rf dmg
          mkdir -p dmg
          cp -R dist/WARPSimLab.app dmg/
          ln -s /Applications dmg/Applications
          name="WARPSimLab-v${VERSION}-macOS-arm64"
          hdiutil create -volname "WARPSimLab" -srcfolder dmg -ov -format UDZO "${name}.dmg"
          shasum -a 256 "${name}.dmg" > "${name}-SHA256.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: WARPSimLab-v${{ inputs.version }}-macOS-arm64-build
          path: |
            WARPSimLab-v${{ inputs.version }}-macOS-arm64.dmg
            WARPSimLab-v${{ inputs.version }}-macOS-arm64-SHA256.txt
          if-no-files-found: error

